# Find People Extract LinkedIn Profile Skill — API Surface Definition
# Source of truth for Tier 3 client generation.
# Regenerate plugin with: opvs-skills generate find-people-extract-linkedin-profile

name: find-people-extract-linkedin-profile
version: "1.0.0"
description: >
  Find people by name/role/company and extract public LinkedIn
  profile data. Supports general people search and direct
  LinkedIn URL extraction.
category: data-collection
base_url: /api/v1/spideriq
upstream:
  base_url: https://spideriq.ai/api/v1  # Option C direct (cut-over)
auth:
  type: pat
  header: Authorization
  prefix: Bearer
  env_var: OPVS_PAT
defaults:
  format: yaml
  timeout_ms: 30000
requires_brand: true
triggers:
  - people
  - linkedin
  - profile
  - person
  - find

methods:
  # -- Submit Jobs -----------------------------------------------
  submitPeopleJob:
    description: >
      Submit a SpiderPeople LinkedIn job. ONE endpoint, three modes,
      selected by the required payload field `mode`:
        profile  — fetch one LinkedIn profile by URL   (requires linkedin_url)
        search   — natural-language profile search     (requires search_query)
        company  — extract employees from a company    (requires company_url)
      Returns a job_id; poll getJobStatus then getJobResults.
    guidance:
      use: "find people on LinkedIn — one profile, a search, or a company's employees"
      next: "getJobStatus, then getJobResults once status=completed"
      warn: >
        `mode` is REQUIRED and has no server-side default you can rely on —
        omitting it is a 422. Each mode requires its own field; sending
        search_query with mode=profile fails validation. `company` mode spends
        Apify credit per employee (short $4/1k, full $8/1k, full_email $12/1k) —
        always set max_employees.
      telemetry_signal_default: "cold"
    http: POST /jobs/spiderPeople/submit
    params:
      payload:
        type: object
        required: true
        description: Job payload — `mode` selects which other fields apply.
        properties:
          mode:
            type: string
            required: true
            enum: [profile, search, company]
            description: Which SpiderPeople mode to run. REQUIRED.
          linkedin_url:
            type: string
            description: Public LinkedIn profile URL. REQUIRED when mode=profile.
          search_query:
            type: string
            description: >
              Natural-language people query, e.g. "CTO fintech Denmark".
              REQUIRED when mode=search.
          search_limit:
            type: integer
            description: Max profiles to return in search mode (1-50, default 10).
          country_code:
            type: string
            description: ISO 3166-1 alpha-2 locale hint for search mode.
          company_url:
            type: string
            description: >
              LinkedIn company URL or slug. REQUIRED when mode=company.
          max_employees:
            type: integer
            description: >
              Max employees to extract in company mode (1-2000, default 100).
              Each employee is billed — always set this.
          profile_mode:
            type: string
            enum: [short, full, full_email]
            description: >
              Employee detail level for company mode. short $4/1k,
              full $8/1k, full_email $12/1k. Default short.
      priority:
        type: string
        description: Optional queue priority.
    response:
      format: json

  submitLinkedinJob:
    description: >
      Submit a public-LinkedIn extraction job (spiderPublicLinkedin) for one
      profile URL. Distinct from submitPeopleJob mode=profile, which is the
      Bright Data-backed SpiderPeople path.
    guidance:
      use: "extract one public LinkedIn profile via the spiderPublicLinkedin worker"
      next: "getJobStatus, then getJobResults"
      warn: "only PUBLIC profiles resolve; a private profile returns status=unavailable, not an error"
      telemetry_signal_default: "cold"
    http: POST /jobs/spiderPublicLinkedin/submit
    params:
      payload:
        type: object
        required: true
        description: Job payload
        properties:
          linkedin_url:
            type: string
            required: true
            description: Public LinkedIn profile URL (e.g. "https://linkedin.com/in/username")
      priority:
        type: string
        description: Optional queue priority.
    response:
      format: json

  # -- Job Status ------------------------------------------------
  getJobStatus:
    description: >
      Check the current status of a submitted job. Returns
      status (queued, running, completed, failed), progress
      percentage, and any error messages.
    http: GET /jobs/{job_id}/status
    params:
      job_id:
        type: string
        required: true
        description: The job ID returned from submit
    response:
      format: yaml

  # -- Job Results -----------------------------------------------
  getJobResults:
    description: >
      Retrieve the results of a completed job. Returns the full
      result payload with all extracted profile data.
    http: GET /jobs/{job_id}/results
    params:
      job_id:
        type: string
        required: true
        description: The job ID to get results for
    response:
      format: yaml

  # -- Cancel Job ------------------------------------------------
  cancelJob:
    description: >
      Cancel a running or queued job. Returns confirmation of
      cancellation. Cannot cancel already completed jobs.
    http: DELETE /jobs/{job_id}
    params:
      job_id:
        type: string
        required: true
        description: The job ID to cancel
    response:
      format: json
