# Send/Receive Email Skill — API surface + envelope contract (Initiative A)
# ONE skill for the SpiderMail agent surface: real mailboxes (Zoho / Gmail /
# Google Workspace / Outlook / iCloud, plus any IMAP host via generic_imap) read
# + written by an agent over a PAT. Read is a direct DB query; send/reply/forward
# is an async job through the SpiderMail worker queue. Templates (Jinja2) render
# on the server; attachments are extracted by the poller and ride inline on the
# message read.
#
# The skill also covers the SEND tier — the fleet layer UNDER the mailbox
# methods. `sendEmail` puts ONE message through ONE mailbox; the send* methods
# operate the sending POOL: onboard a domain the tenant owns (BYO), read the
# pool and its reputation, and drive a broadcast from draft to fan-out.
#
# Source of truth for Tier-3 marketplace client generation. Every method below
# maps to a route VERIFIED served in app/api/v1/mail.py, mail_templates.py,
# mail_views.py, mail_outreach.py, mail_convert.py, jobs/spidermail.py, or
# dashboard_send_{byo,broadcasts,analytics}.py (send tier re-verified
# 2026-08-11 against the Broadcasting v3 Phase-2 routes). No phantom endpoints.
# Outreach methods are brand-scoped (/brands/{id}/mail/outreach/*) — reads
# PAT-ok, writes brand-admin (require_brand_admin_or_super).
#
# Auth: SPIDERIQ_PAT (Bearer client_id:api_key:api_secret) per the SpiderCLI
# convention. base_url is /api/v1; every method path carries its own /mail/*
# (or /jobs/*, /dashboard/send/*) segment, so the full URL is e.g.
# https://spideriq.ai/api/v1/mail/inbox.
#
# The send tier is tenant-scoped by the CALLER'S OWN TOKEN
# (require_tenant_scoped_access, cookie OR PAT). No method takes a client_id and
# none ever should: tenancy resolves server-side, and a caller-supplied tenant
# id would be a cross-tenant lever.

name: spidermail
version: "0.9.0"
description: >
  Agent-driven email over SpiderMail — read a mailbox (inbox, single message,
  conversation thread, full-text search, one-call session bootstrap), send/reply/
  forward through a registered mailbox, render and manage Jinja2 templates, mark
  messages read/starred/labelled, and review the security quarantine. Run
  BROADCASTS on your own sending pool: bring your own sending domain (SPF / DKIM
  / tracking-CNAME verified, your provider key stored encrypted), read the pool's
  warm-up state and reputation, then draft, preview, size and fan out a paced
  broadcast. Inbound HTML is delivered as clean structured data (~37x fewer
  tokens); outbound bodies are written in markdown and auto-converted to
  professional HTML. Per-tenant, PAT-scoped. Agent-friendly ?format=yaml|md on
  every read.
category: communication
base_url: /api/v1
upstream:
  base_url: https://spideriq.ai/api/v1  # Option C direct (cut-over)
auth:
  type: pat
  header: Authorization
  prefix: Bearer
  env_var: SPIDERIQ_PAT
defaults:
  format: json
  timeout_ms: 30000
requires_brand: true
triggers:
  - email
  - inbox
  - send email
  - reply
  - forward
  - compose
  - mail
  - mailbox
  - check my email
  - read my email
  - search email
  - email thread
  - email template
  - mark as read
  - broadcast
  - send a broadcast
  - email campaign
  - newsletter
  - bring your own domain
  - sending domain
  - SPF
  - DKIM
  - deliverability
  - bounce rate
  - sending reputation
  - warm up

guidance:
  use: >
    Handle email on a brand's behalf — read a real mailbox (inbox / message /
    thread / search / session), send/reply/forward, render+manage templates, and
    keep the inbox tidy (read/star/labels). Inbound arrives as clean data, outbound
    is written in markdown. The send* methods add the fleet layer: onboard your own
    sending domain, read the pool's warm-up state and reputation, and run a paced
    broadcast from draft to fan-out.
  not:
    - "spiderflows / lead-search -> FIND prospects and emails to contact (this sends to addresses you already have)"
    - "spiderVerify -> validate that an address is deliverable BEFORE sending (this does not verify recipients)"
    - "the SpiderPublish content tools -> publish a web page or a marketing site (this is 1:1 email, not web content)"
    - "mail-admin (admin-skills) -> PROVISION mailboxes on a provider org; that is the operator control plane, this is the tenant's own surface"
  intent_aliases: ["q", "query", "search_query"]   # Q1 — searchMail takes textual search
  pitfalls:
    - "A send is ASYNC: POST returns a job_id (queued), NOT a delivered email. Poll the job to confirm — a queued job can still fail at SMTP."
    - "Email is irreversible — there is no unsend. Confirm the real recipient with the user before any non-test send."
    - "reply/forward need the numeric reply_to_message_id (the message `id`), NOT the RFC Message-ID header string."
    - "Outbound bodies containing secrets (API keys, passwords, private keys) are BLOCKED by the credential scanner before SMTP — never put a token in body_text."
    - "Attachment text rides inline on getMessage (?include_attachments) as a preview; there is no separate attachment-fetch endpoint (see references/gaps.md)."
    - "DRAFT IS NOT A SEND. sendCreateBroadcast creates a draft and `scheduled_at` only RECORDS intent — sendQueueBroadcast is the one and only call that puts mail on the wire, and rows already enqueued are not withdrawn by a later cancel."
    - "A `null` DNS verdict from sendCheckDomain is UNDETERMINABLE, never a pass. `verified` is true only when all three checks are true."
    - "On a queue result, `already_enqueued > 0` (a resumed, idempotent fan-out) and `provider_configured: false` (a deliberate dormant queue) are NOT failures. The real refusals are 422 no_audience, 422 no_sources and 503 suppression-unavailable."
    - "Do NOT score engagement on `opened` — Apple MPP and proxy preloading fire open pixels with no human involved. Use `clicked` / `unique_clickers`; `opens_are_estimates` is always true."
    - "A null complaint_pct / bounce_pct is UNKNOWN, never healthy — and a null rate on a funnel means a ZERO denominator, not a zero rate. Never render either as 0%."

methods:
  # ── Read: inbox, message, thread, search, session ─────────────
  getInbox:
    description: >
      List inbox messages. With no `email` this is the Master Inbox (every
      message across all the tenant's mailboxes, newest first); pass `email` to
      scope to one mailbox, or `view_id` to apply a saved view's filter. Filter
      by `folder` and `unread_only`; paginate with `limit`/`offset`.

      By default rows carry only a 200-character `body_text_preview`. Set
      `include_body=true` AND `format=yaml` to get each message's full resolved
      body inline — that combination avoids an N+1 fan-out to getMessage and is
      the cheapest way to read a page of mail. See the `body_source` note under
      getMessage for what the body envelope means.
    guidance:
      use: "browse what just arrived — the master inbox, one mailbox, or a saved view"
      next: "getMessage to open one (marks it read); getThread to see the whole conversation"
      warn: "no `email` = ALL mailboxes (master inbox). Reading a message via getMessage marks it read; getInbox does not. `include_body` defaults FALSE and only takes effect with format=yaml — asking for full bodies as JSON silently returns previews only."
      telemetry_signal_default: "hot"
    http: GET /mail/inbox
    params:
      email:        { type: string,  required: false, description: 'Scope to one mailbox address. Omit for the client-wide Master Inbox.' }
      view_id:      { type: integer, required: false, description: 'Apply a saved view (/mail/views) filter_config by id' }
      unread_only:  { type: boolean, required: false, description: 'Only unread messages' }
      folder:       { type: string,  required: false, description: 'INBOX (default) | Sent | Drafts | Trash' }
      include_body: { type: boolean, required: false, description: 'Include each message full resolved body + envelope (default FALSE). Requires format=yaml to appear.' }
      limit:        { type: integer, required: false, description: 'Page size (default 20, max 100)' }
      offset:       { type: integer, required: false, description: 'Pagination offset (default 0)' }
      format:       { type: string,  required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  getSession:
    description: >
      One-call agent bootstrap for a mailbox: its info, unread count, and the
      most recent messages in a single response. Optimised for an agent that
      needs to understand mailbox state fast. Use ?format=yaml for ~60% fewer tokens.
    guidance:
      use: "FIRST call when starting work on a mailbox — state + recent messages in one round-trip"
      next: "getMessage to open one; sendEmail to act"
      warn: "`email` is required (this is per-mailbox, not master-inbox). 404 if that address is not a registered mailbox of yours."
      telemetry_signal_default: "hot"
    http: GET /mail/session
    params:
      email:          { type: string,  required: true,  description: 'Mailbox email address' }
      include_recent: { type: integer, required: false, description: 'Number of recent messages to include (0-50, default 10)' }
      format:         { type: string,  required: false, description: 'json (default) | yaml' }
    response: { format: json }

  getMessage:
    description: >
      Read one message by its numeric id, including the full clean body and
      headers. Reading MARKS THE MESSAGE READ. With include_attachments (default
      true) the response carries each attachment's filename, type, size, and an
      extracted-text preview inline.

      With `format=yaml` the body arrives as an ENVELOPE rather than a bare
      string, and the envelope always explains itself:

        body             the resolved body — plain text as stored, or markdown
                         converted from the HTML part
        body_source      WHY that body is what it is:
                           text/plain          served from the stored plain part
                           converted           HTML was converted to markdown
                           none                the message genuinely has no body
                           html_too_large      HTML exceeded the 65,536-byte
                                               per-message conversion cap
                           html_not_converted  the request's shared conversion
                                               budget was already spent on
                                               earlier messages in the page
        size_original    bytes of the source part
        size_normalized  bytes of the body actually returned
        rfc822_message_id  the RFC Message-ID header (YAML only; the JSON
                           response calls this field `message_id`)

      An empty `body` is therefore never ambiguous: `none` means there was
      nothing to read, while `html_too_large` / `html_not_converted` mean we
      declined the work and you can re-request that message on its own.
    guidance:
      use: "open a single message to read its full body + attachment previews"
      next: "sendEmail action=reply with reply_to_message_id=<this id>; updateMessage to (un)star/label"
      warn: "side effect: this marks the message read. `message_id` is the numeric DB id from a list/search row, not the RFC Message-ID header. The body envelope (body_source / size_original / size_normalized / rfc822_message_id) is emitted ONLY for format=yaml — the JSON response returns the plain model without it."
      telemetry_signal_default: "warm"
    http: GET /mail/messages/{message_id}
    params:
      message_id:          { type: string,  required: true,  description: 'Numeric message id (the `id` from getInbox/searchMail)' }
      include_attachments: { type: boolean, required: false, description: 'Include attachment summaries + text previews (default true)' }
      format:              { type: string,  required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  getThread:
    description: >
      Get an entire conversation thread by thread_id — every inbound and
      outbound message in the thread, in order. The thread_id is on each message
      row; it is computed from the RFC References/In-Reply-To chain. With
      `format=yaml` every message carries the same body envelope described under
      getMessage, and the whole thread shares ONE conversion budget — so a long
      thread of large HTML messages can legitimately return
      `body_source: html_not_converted` on its later messages.
    guidance:
      use: "see the whole back-and-forth before replying, so you keep context"
      next: "sendEmail action=reply with reply_to_message_id = the latest message's id in the thread"
      warn: "thread_id is the computed thread root id (a message field), not a message id and not a subject. Body envelopes are format=yaml only, and the per-request conversion budget is shared across the whole thread."
      telemetry_signal_default: "warm"
    http: GET /mail/threads/{thread_id}
    params:
      thread_id: { type: string, required: true,  description: 'Thread id (the `thread_id` field on any message in the thread)' }
      format:    { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  searchMail:
    description: >
      Full-text search a mailbox (subject + body) plus structured filters by
      sender, subject substring, and date range. `q` is the FTS query;
      from_addr/subject are ILIKE substring filters; since/before bound the date.
    guidance:
      use: "find a past email by words in it, by who sent it, or within a date range"
      next: "getMessage to open a hit; getThread for its full conversation"
      warn: "`email` (the mailbox to search) is REQUIRED. `q` is the search text — intent_aliases q/query/search_query map here."
      telemetry_signal_default: "warm"
    http: GET /mail/search
    params:
      email:     { type: string, required: true,  description: 'Mailbox email address to search (required)' }
      q:         { type: string, required: false, description: 'Full-text query over subject + body' }
      from_addr: { type: string, required: false, description: 'Filter by sender address (substring, ILIKE)' }
      subject:   { type: string, required: false, description: 'Filter by subject (substring, ILIKE)' }
      since:     { type: string, required: false, description: 'Only messages on/after this ISO-8601 date' }
      before:    { type: string, required: false, description: 'Only messages before this ISO-8601 date' }
      limit:     { type: integer, required: false, description: 'Max results (default 20)' }
      format:    { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  # ── Mailboxes ─────────────────────────────────────────────────
  listMailboxes:
    description: >
      List the tenant's registered mailboxes with per-mailbox unread counts and
      each mailbox's OBSERVED health. `health` is one of `active` (polled
      recently, no error), `connecting` (enabled, but no poll has ever
      completed), `error` (the last poll failed — read poll_error_cause /
      poll_error_action), `stalled` (no poll for over 6 hours and no error
      reported) or `disabled` (switched off). `health_detail` is one
      plain-English sentence for the same state. Each row also carries
      `ever_connected` (boolean) — has this mailbox EVER completed a successful
      poll? It is ORTHOGONAL to `health`, not a sixth state, and both must be
      read to know what to do about a mailbox.
    guidance:
      use: "see which mailboxes you can send-from / read, and which of them are actually working"
      next: "getSession <email> to bootstrap one; getInbox for the master view"
      warn: >
        🔴 READ `health`, NEVER `is_active`, to decide whether a mailbox works.
        `is_active` is written literally true at INSERT and only means "this row
        is enabled" — a mailbox that has never connected, or that is timing out
        on every cycle, still carries is_active=true. It is the operator's
        on/off switch, which is a real but different thing.

        `error` OUTRANKS a fresh timestamp on purpose: the failing path stamps
        last_poll_at too, so a mailbox failing every 5 minutes has a perfectly
        current timestamp and is completely broken. Equally, `poll_error IS
        NULL` is not evidence of health — the poller clears that column on a
        clean run, so a mailbox the loop silently stopped visiting keeps its
        last successful NULL forever. That is what `stalled` exists to catch.

        🔴 `disabled` does NOT tell you whether the mailbox ever worked — branch
        on `ever_connected` as well. `disabled` + ever_connected=true is a
        working mailbox someone paused, and needs nothing done. `disabled` +
        ever_connected=false was never commissioned: switching it on will not
        make it connect, so fix its credentials FIRST or delete it. The same
        composition applies to `error`: ever_connected=false means it has never
        once worked, ever_connected=true means a regression — a different
        conversation with the account owner. This is a boolean rather than a
        sixth `health` value precisely so your existing branch table over the
        five states stays correct.

        A mailbox reporting `active` is not a promise that its history is fully
        ingested — see the reference on connecting a mailbox. Each row also
        carries its ingest bounds (`sync_scope`, `sync_scope_n`,
        `sync_since_date`) and its cadence (`poll_interval_seconds`, null =
        the platform 300s tick). Read those before concluding that mail is
        "missing": a mailbox on `last_n: 500` is behaving correctly when it
        does not hold last year's messages.

        the `from_email` you send with MUST be one of these registered addresses.
      telemetry_signal_default: "warm"
    http: GET /mail/mailboxes
    params:
      format: { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  getMailboxStats:
    description: >
      Per-mailbox aggregates (total / unread / starred counts) plus client-wide
      totals — the data behind the Master Inbox sidebar.
    guidance:
      use: "get unread/starred counts per mailbox without listing messages"
      telemetry_signal_default: "warm"
    http: GET /mail/mailboxes/stats
    params:
      format: { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  listMailProviders:
    description: >
      List the supported providers and their published connection defaults —
      hosts, ports, the sent-folder name, whether an app password is required,
      where to generate one, and which username shape each protocol expects.
    guidance:
      use: "show the user which providers are supported, or explain the app-password requirement before asking them for credentials"
      next: "createMailbox — you do NOT need to pass anything from here, the same presets are applied server-side"
      warn: >
        read-only discovery. It reports iCloud's asymmetric username shape; do not
        paper over that by sending the email address for both protocols. A preset
        may also carry routed_providers — named providers that WORK but are not
        preset values of their own (Fastmail, on the generic_imap entry). Read
        that list before telling a user their provider is unsupported: its `route`
        field is the value to send as `provider`, and the `name` is not a valid
        one. If a routed provider has send_capable=false, do not enrol it as a
        bulk sending source no matter what the user asks for.
      telemetry_signal_default: "cold"
    http: GET /mail/providers
    params: {}
    response: { format: json }

  createMailbox:
    description: >
      Register/connect an external mailbox by its IMAP + SMTP credentials.
      Passwords are Fernet-encrypted at rest. Hosts, ports and usernames are
      optional — they default to the provider's published settings.
      REGISTRATION VERIFIES BEFORE IT SAVES: unless you pass
      skip_verification=true, the server dials IMAP and SMTP first and returns
      422 without creating anything if either fails. On success the response
      carries health=`connecting`, NOT `active` — the probe proved the
      credentials, it did not prove a poll has run. The poller promotes it to
      `active` on its first successful cycle. A NEW mailbox ingests the LAST
      500 MESSAGES by default (`sync_scope: last_n`), not its whole history —
      see sync_scope below before assuming older mail will appear.
    guidance:
      use: "connect a Zoho / Gmail / Google Workspace / Outlook / iCloud / Fastmail / self-hosted mailbox so the agent can read + send from it"
      next: "re-read the mailbox via listMailboxes and check `health` — a successful create means the credentials work, not that the mailbox is ingesting"
      warn: >
        Pass ONLY email_address, provider and the two passwords unless the server
        is non-standard — omitted hosts/ports/usernames are filled from the
        provider preset, and that is the only way to get iCloud right (its IMAP
        username is the bare local part while its SMTP username is the full
        address). Nearly every provider rejects the account password and requires
        an app-specific one. Gmail/Workspace need 2-Step Verification, and app
        passwords are unavailable on security-key-only and Advanced Protection
        accounts. provider=generic_imap infers nothing and needs all six
        connection fields. FASTMAIL IS NOT A PROVIDER VALUE — `provider:
        "fastmail"` is rejected. Fastmail connects as provider=generic_imap with
        imap.fastmail.com:993 / smtp.fastmail.com:465 / Sent, it needs an app
        password, its Basic tier has no IMAP/SMTP at all so the integration
        cannot work on it, and it is INBOX-ONLY: Fastmail's terms ban email
        warming and they close accounts rather than throttle them. See
        listMailProviders → generic_imap → routed_providers.

        🔴 A 422 `error.code = MAILBOX_VERIFICATION_FAILED` means NOTHING WAS
        SAVED — do not treat it as a partial success and do not retry blind.
        Read it off `error`, the platform envelope object, NOT a top-level
        `error` string and NOT `detail` (changed in 0.9.0, card UI.3 — the flat
        shape this once described was never emitted). The object is structured:
        `imap_ok` / `smtp_ok` name which protocol failed,
        `imap_error` / `smtp_error` carry the server's own text, and
        `verification_unavailable` is the field that decides what to do next.
        TRUE means WE could not complete the check, so offering
        skip_verification=true is honest. FALSE means the mail server actively
        rejected the credentials — re-sending with skip_verification=true then
        registers a mailbox you have been told is broken. Fix the password
        instead; on the five preset providers the near-certain cause is an
        account password where an app-specific one is required.

        📥 SCOPE THE INGEST DELIBERATELY (added 0.10.0, card S.1). Omitting
        sync_scope gives `last_n` = 500 messages, which is the right answer
        for almost every agent. Do NOT reach for `sync_scope: "all"` to be
        thorough — it ingests the ENTIRE mailbox at roughly 100 messages per
        5-minute cycle (~28,800/day, so ~3.5 days for a 100k mailbox, stored
        in full), and on Gmail it is a live rate-limit hazard rather than a
        theoretical one. Ask the user before choosing it. The three shapes are
        mutually exclusive and the server rejects a mixture: `last_n` takes
        sync_scope_n and NOT sync_since_date, `since_date` takes
        sync_since_date and NOT sync_scope_n, and `all` takes NEITHER.
      telemetry_signal_default: "cold"
    http: POST /mail/mailboxes
    params:
      email_address: { type: string,  required: true,  description: 'Mailbox email address' }
      provider:      { type: string,  required: true,  description: 'zoho | gmail | google_workspace | outlook | icloud | generic_imap' }
      imap_password: { type: string,  required: true,  description: 'IMAP password / app password (encrypted at rest)' }
      smtp_password: { type: string,  required: true,  description: 'SMTP password / app password (encrypted at rest). A separate field from imap_password even when one app password authenticates both — the API always takes two.' }
      skip_verification: { type: boolean, required: false, description: 'Register WITHOUT first proving the credentials work (default false). Default behaviour dials IMAP+SMTP and returns 422 rather than creating a mailbox that has never connected. Set true only to accept an unverified mailbox deliberately — it is then recorded with no successful poll and reports health `connecting`, never `active`, until a poll actually succeeds.' }
      imap_host:     { type: string,  required: false, description: 'IMAP server hostname (default: the provider''s published host)' }
      imap_username: { type: string,  required: false, description: 'IMAP login username (default: the shape this provider expects)' }
      smtp_host:     { type: string,  required: false, description: 'SMTP server hostname (default: the provider''s published host)' }
      smtp_username: { type: string,  required: false, description: 'SMTP login username (default: the shape this provider expects)' }
      display_name:  { type: string,  required: false, description: 'Sender display name' }
      imap_port:     { type: integer, required: false, description: 'IMAP port (default: the provider''s published port, usually 993)' }
      smtp_port:     { type: integer, required: false, description: 'SMTP port (default: the provider''s published port)' }
      sync_scope:    { type: string,  required: false, description: 'How far back to ingest on connect: last_n (DEFAULT) | since_date | all. The default is last_n/500 — deliberately not `all`. Mailboxes connected before migration 481 carry `all` because that was the only behaviour that existed; that is a legacy column default, not a recommendation.' }
      sync_scope_n:  { type: integer, required: false, description: 'Message count for sync_scope=last_n (1..100000, defaults to 500). An UPPER BOUND, not an exact count: the start UID is derived from the folder''s UIDNEXT and UIDs are sparse wherever mail was deleted, so you may receive FEWER than N — never more. Rejected with sync_scope=since_date or all.' }
      sync_since_date: { type: string, required: false, description: 'Cutoff date (ISO 8601, YYYY-MM-DD) for sync_scope=since_date. REQUIRED with that scope, rejected with last_n or all.' }
      poll_interval_seconds: { type: integer, required: false, description: 'Per-mailbox poll cadence (60..86400). Omit for the platform default (300s). This can only make a mailbox poll LESS often — the global tick is the scheduler resolution, so the effective cadence is max(this, 300s) and a value under 300 buys nothing. Use it to BACK OFF a provider that is rate-limiting you.' }
    response: { format: json }

  updateMailbox:
    description: >
      Change a registered mailbox's settings: display name, on/off switch,
      default template + variables, and — since card S.1 — its INGEST SCOPE and
      poll cadence. A PATCH: an omitted field is left alone, never reset. No
      IMAP/SMTP password is required or accepted; ownership is by the
      authenticated client plus the address, so this cannot change credentials.
      Returns the full updated mailbox row.
    guidance:
      use: "re-scope a mailbox that ingested too little or too much history, back off a rate-limited provider's poll cadence, rename the sender, or disable polling without deleting anything"
      next: "listMailboxes and read sync_scope / poll_interval_seconds back — a scope change takes effect on the NEXT poll cycle, not immediately"
      warn: >
        🔴 CHANGING sync_scope REWINDS THE MAILBOX. Any scope change clears the
        resolved floor and rewinds the read watermarks, so the next cycle
        re-resolves from scratch under the new scope. This is not incidental —
        the poller always walks FORWARD and applies the floor as
        max(watermark, floor), so lowering the floor alone would do nothing
        once the watermark had passed it, and "widening backfills
        automatically" would be a silent no-op.

        What that costs you, stated plainly: it RE-WALKS, so it spends
        provider bandwidth again, bounded by the unchanged 100-messages-per-
        cycle cap. What it does NOT cost you: nothing is deleted and nothing is
        duplicated. Re-ingest is idempotent on a global UNIQUE(message_id), and
        NARROWING a scope only stops the poller reaching further back — mail
        already stored stays stored. Deleting stored mail is a separate,
        explicit action this endpoint never performs.

        ⚠️ THE DEFAULTING RULE IS THE OPPOSITE OF createMailbox. On create,
        `sync_scope: "last_n"` with no count defaults to 500. On UPDATE the
        same request is a 422 — `sync_scope_n is required when
        sync_scope='last_n'`. A PATCH cannot tell "use the default" apart from
        "leave it alone", so it refuses to guess. Always send the count
        explicitly here. Same for since_date. Passing a parameter that does
        not belong to the new scope is also a 422.

        Sending poll_interval_seconds WITHOUT sync_scope changes cadence only
        and does NOT rewind — use that when a provider is rate-limiting you
        and you do not want to re-walk anything.
      telemetry_signal_default: "cold"
    http: PATCH /mail/mailboxes/{email}
    params:
      email:         { type: string,  required: true,  description: 'Mailbox email address to update (path parameter)' }
      display_name:  { type: string,  required: false, description: 'Sender display name used in the From header' }
      is_active:     { type: boolean, required: false, description: 'Enable/disable inbound IMAP polling. This is the operator switch, NOT a health signal — read `health` from listMailboxes for that.' }
      default_template_id: { type: integer, required: false, description: 'Default template for outbound mail from this mailbox. Pass 0 to CLEAR it (0 is the sentinel for null, not a template id).' }
      template_variables:  { type: object,  required: false, description: 'Default template variable values, merged with job-level data at send time' }
      sync_scope:    { type: string,  required: false, description: 'all | last_n | since_date. REWINDS the mailbox — see the warning. Widening makes the next cycles walk further back; narrowing only stops reaching back and deletes nothing.' }
      sync_scope_n:  { type: integer, required: false, description: 'Message count for sync_scope=last_n (1..100000). REQUIRED here whenever sync_scope=last_n — unlike createMailbox, this does NOT default to 500.' }
      sync_since_date: { type: string, required: false, description: 'Cutoff date (ISO 8601) for sync_scope=since_date. Required with that scope.' }
      poll_interval_seconds: { type: integer, required: false, description: 'Per-mailbox poll cadence (60..86400). Can only make the mailbox poll LESS often than the 300s platform tick. Send it alone to back off a provider without triggering a rewind.' }
    response: { format: json }

  testMailbox:
    description: Test a mailbox's IMAP + SMTP connectivity without sending anything.
    guidance:
      use: "verify a freshly connected mailbox before sending through it"
      warn: "a failure here is almost always a wrong port/TLS or a non-app-password. 465=implicit SSL, 587=STARTTLS."
      telemetry_signal_default: "cold"
    http: POST /mail/mailboxes/{email}/test
    params:
      email: { type: string, required: true, description: 'Mailbox email address to test' }
    response: { format: json }

  deleteMailbox:
    description: Remove a mailbox connection and all of its stored messages.
    guidance:
      use: "disconnect a mailbox you no longer manage"
      warn: "DESTRUCTIVE — deletes the mailbox AND every stored message for it. Confirm with the user first; there is no undo."
      telemetry_signal_default: "cold"
    http: DELETE /mail/mailboxes/{email}
    params:
      email: { type: string, required: true, description: 'Mailbox email address to remove' }
    response: { format: json }

  # ── Send / reply / forward (async via the worker queue) ───────
  sendEmail:
    description: >
      Send a new email, reply to an existing one, or forward one — through a
      registered mailbox, via the SpiderMail worker queue. Write `body_text` in
      markdown; it is auto-converted to professional HTML (pass body_html only to
      override). Returns a job_id (QUEUED) — poll the job to confirm delivery.
    guidance:
      use: "deliver email: action=send (new), reply (responds + auto-threads), forward (passes along)"
      next: "get_job_status with the returned job_id — a 201 means QUEUED, not delivered"
      warn: "IRREVERSIBLE + ASYNC. Confirm the recipient with the user first. reply/forward need the numeric reply_to_message_id. Set test=true to route to the test queue while developing."
      telemetry_signal_default: "cold"
    http: POST /jobs/spiderMail/submit
    params:
      payload:
        type: object
        required: true
        description: The email job payload
        properties:
          action:              { type: string,  required: true,  description: 'send | reply | forward (default send)' }
          from_email:          { type: string,  required: true,  description: 'Sender — MUST be a registered mailbox address' }
          to:                  { type: array,   items: string, required: false, description: 'Recipients (required for send/forward)' }
          cc:                  { type: array,   items: string, required: false, description: 'CC recipients' }
          subject:             { type: string,  required: false, description: 'Subject (required for send; inherited on reply/forward)' }
          body_text:           { type: string,  required: true,  description: 'Body in markdown (auto-converted to HTML)' }
          body_html:           { type: string,  required: false, description: 'Explicit HTML body (override; usually leave unset)' }
          template_name:       { type: string,  required: false, description: 'Apply a saved template by name (Jinja2)' }
          template_data:       { type: object,  required: false, description: 'Variable values for the template' }
          reply_to_message_id: { type: integer, required: false, description: 'Numeric message id to reply to / forward (required for reply/forward)' }
          reply_all:           { type: boolean, required: false, description: 'Reply to all recipients (reply action only)' }
          test:                { type: boolean, required: false, description: 'Route to the test queue instead of sending (default false)' }
    response: { format: json }

  # ── Message state: read / star / labels ──────────────────────
  updateMessage:
    description: >
      Update a message's flags — mark read/unread, star/unstar, set labels, or
      attach a private note. Only the fields you pass change.
    guidance:
      use: "keep the inbox tidy — mark read, star a hot lead, tag with labels"
      next: "getInbox unread_only=true to see what remains"
      warn: "labels REPLACES the label set (it is not additive) — send the full intended list. message_id is the numeric id."
      telemetry_signal_default: "warm"
    http: PATCH /mail/messages/{message_id}
    params:
      message_id: { type: string,  required: true,  description: 'Numeric message id' }
      is_read:    { type: boolean, required: false, description: 'Mark read (true) / unread (false)' }
      is_starred: { type: boolean, required: false, description: 'Star / unstar' }
      labels:     { type: array,   items: string, required: false, description: 'Replace the message label set with this list' }
      notes:      { type: string,  required: false, description: 'Private per-message note (not sent to anyone)' }
    response: { format: json }

  # ── Templates (Jinja2, server-rendered) ──────────────────────
  listTemplates:
    description: List the tenant's email templates (signature / header / layout / full).
    guidance:
      use: "see reusable templates before composing"
      next: "previewTemplate to render one with variables; sendEmail template_name=<name>"
      telemetry_signal_default: "warm"
    http: GET /mail/templates
    params:
      format: { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  getTemplate:
    description: Get one template's full source (html_source + detected variables) by id.
    guidance:
      use: "inspect a template's Jinja2 source and variable list"
      warn: "template_id is the integer id from listTemplates."
      telemetry_signal_default: "warm"
    http: GET /mail/templates/{template_id}
    params:
      template_id: { type: string, required: true,  description: 'Integer template id' }
      format:      { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  createTemplate:
    description: >
      Create a reusable Jinja2 email template. template_type controls how it is
      applied: signature (appended), header (prepended), layout (wraps the body
      via a {{ body }} slot), or full (the whole email). Variables are auto-detected
      from {{ ... }} if not supplied.
    guidance:
      use: "save a branded signature / layout / full template for repeated sends"
      next: "previewTemplate to render it; sendEmail template_name=<name>"
      warn: "name must be unique per client and is lowercased (letters/numbers/-/_ only). Rendering is sandboxed Jinja2 — no arbitrary code."
      telemetry_signal_default: "cold"
    http: POST /mail/templates
    params:
      name:          { type: string,  required: true,  description: 'Unique template name ([a-z0-9-_], lowercased)' }
      html_source:   { type: string,  required: true,  description: 'Jinja2 HTML source' }
      template_type: { type: string,  required: false, description: 'signature | header | layout | full (default full)' }
      description:   { type: string,  required: false, description: 'Human description' }
      text_source:   { type: string,  required: false, description: 'Optional plain-text variant' }
      variables:     { type: array,   items: string, required: false, description: 'Variable names (auto-detected if omitted)' }
      is_default:    { type: boolean, required: false, description: 'Set as the default for this template_type' }
    response: { format: json }

  updateTemplate:
    description: Update an existing template (any subset of its fields).
    guidance:
      use: "edit a template's source, type, or default flag"
      warn: "uses PUT — send the fields you want to change. template_id is the integer id."
      telemetry_signal_default: "cold"
    http: PUT /mail/templates/{template_id}
    params:
      template_id:   { type: string,  required: true,  description: 'Integer template id' }
      name:          { type: string,  required: false, description: 'New unique name' }
      html_source:   { type: string,  required: false, description: 'New Jinja2 HTML source' }
      template_type: { type: string,  required: false, description: 'signature | header | layout | full' }
      description:   { type: string,  required: false, description: 'New description' }
      text_source:   { type: string,  required: false, description: 'New plain-text variant' }
      variables:     { type: array,   items: string, required: false, description: 'New variable list' }
      is_active:     { type: boolean, required: false, description: 'Enable / disable' }
      is_default:    { type: boolean, required: false, description: 'Set as default for its type' }
    response: { format: json }

  deleteTemplate:
    description: Delete a template by id.
    guidance:
      use: "remove a template no longer in use"
      warn: "a mailbox that set this as its default_template_id falls back to no template."
      telemetry_signal_default: "cold"
    http: DELETE /mail/templates/{template_id}
    params:
      template_id: { type: string, required: true, description: 'Integer template id' }
    response: { format: json }

  previewTemplate:
    description: >
      Render a template with sample variable values and return the resulting HTML
      WITHOUT sending anything. The safe way to check a template before a real send.
    guidance:
      use: "render a template with real values to eyeball the output before sending"
      next: "sendEmail template_name=<name> template_data=<same variables> once it looks right"
      warn: "variables is the variable map (the legacy alias is template_data — both accepted). Missing variables render empty, they do not error."
      telemetry_signal_default: "warm"
    http: POST /mail/templates/{template_id}/preview
    params:
      template_id: { type: string, required: true,  description: 'Integer template id' }
      variables:   { type: object, required: false, description: 'Variable values for the render (alias: template_data)' }
    response: { format: json }

  # ── AI compose assist ─────────────────────────────────────────
  composeAssist:
    description: >
      AI writing assistant for email. action=write generates a new draft from
      subject/context; rewrite/expand/shorten/formal/casual/fix_grammar transform
      the text in `context`. Returns suggested text — it does NOT send.
    guidance:
      use: "draft or improve email copy before sending — write new, or transform a draft"
      next: "sendEmail with the returned text once the user approves it"
      warn: "this only DRAFTS — nothing is sent. For action=write, context is the brief; for transforms, context is the text to change."
      telemetry_signal_default: "warm"
    http: POST /mail/compose/assist
    params:
      action:         { type: string, required: true,  description: 'write | rewrite | expand | shorten | formal | casual | fix_grammar' }
      context:        { type: string, required: false, description: 'The brief (for write) or the text to transform' }
      subject:        { type: string, required: false, description: 'Subject, for context' }
      tone:           { type: string, required: false, description: 'professional (default) | friendly | casual | formal' }
      thread_context: { type: string, required: false, description: 'Prior thread messages for context' }
    response: { format: json }

  # ── Security: quarantine review ───────────────────────────────
  listSecurityEvents:
    description: >
      List security events for the tenant's mailboxes — inbound prompt-injection
      detections, outbound credential blocks, quarantines, releases.
    guidance:
      use: "audit what the inbound scanner / outbound credential blocker flagged"
      next: "listQuarantine to see held messages; releaseMessage to release a false positive"
      telemetry_signal_default: "cold"
    http: GET /mail/security/events
    params:
      limit:  { type: integer, required: false, description: 'Max events (default 50)' }
      format: { type: string,  required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  listQuarantine:
    description: List messages auto-quarantined by the inbound prompt-injection scanner.
    guidance:
      use: "review messages held back from the inbox as suspicious"
      next: "releaseMessage to release one you judge safe"
      warn: "quarantined messages are deliberately kept out of getInbox — this is the only way to see them."
      telemetry_signal_default: "cold"
    http: GET /mail/quarantine
    params:
      format: { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  releaseMessage:
    description: Release a quarantined message back into the normal inbox.
    guidance:
      use: "clear a false-positive quarantine so the message is readable again"
      warn: "only release after a human judges the content safe — quarantine exists to stop prompt-injection reaching the agent."
      telemetry_signal_default: "cold"
    http: POST /mail/messages/{message_id}/release
    params:
      message_id: { type: string, required: true, description: 'Numeric id of the quarantined message' }
    response: { format: json }

  # ── Organise the inbox: folders, bulk, snooze, labels, views ──
  listFolders:
    description: List a mailbox's folders (INBOX / Sent / Drafts / Trash …) with per-folder totals + unread counts. `email` is required.
    guidance:
      use: "see one mailbox's folder structure + counts before scoping getInbox to a folder"
      warn: "`email` is REQUIRED (this is per-mailbox; there is no client-wide folder list). Omitting it is a 422."
      telemetry_signal_default: "warm"
    http: GET /mail/folders
    params:
      email:  { type: string, required: true,  description: 'Mailbox email address (required)' }
      format: { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  bulkUpdateMessages:
    description: >
      Apply one action to many messages at once — the fast path for inbox triage.
      action ∈ mark_read | mark_unread | archive | delete | add_label (add_label
      needs `label`). Up to 100 message ids per call.
    guidance:
      use: "triage in bulk — mark a page read, archive a batch, label many at once"
      next: "getInbox unread_only=true to see what remains"
      warn: "delete is destructive (no undo). add_label requires the `label` field. Max 100 ids per call."
      telemetry_signal_default: "warm"
    http: POST /mail/messages/bulk
    params:
      message_ids: { type: array,  items: integer, required: true,  description: 'Message ids to act on (1-100)' }
      action:      { type: string, required: true,  description: 'mark_read | mark_unread | archive | delete | add_label' }
      label:       { type: string, required: false, description: 'Label name (required when action=add_label)' }
    response: { format: json }

  snoozeMessage:
    description: Hide a message from the inbox until a timestamp, then auto-return it to its folder.
    guidance:
      use: "defer a message you can't deal with yet — it reappears at snoozed_until"
      next: "listSnoozed to see what's deferred; unsnoozeMessage to bring it back early"
      warn: "snoozed_until is an ISO-8601 timestamp in the future. The message leaves the inbox until then."
      telemetry_signal_default: "warm"
    http: POST /mail/messages/{message_id}/snooze
    params:
      message_id:   { type: string, required: true, description: 'Numeric message id' }
      snoozed_until: { type: string, required: true, description: 'ISO-8601 timestamp to unsnooze at' }
    response: { format: json }

  unsnoozeMessage:
    description: Cancel a snooze — return the message to the inbox now.
    guidance:
      use: "bring a snoozed message back early"
      telemetry_signal_default: "warm"
    http: DELETE /mail/messages/{message_id}/snooze
    params:
      message_id: { type: string, required: true, description: 'Numeric message id' }
    response: { format: json }

  listSnoozed:
    description: List messages currently snoozed (hidden from the inbox until their unsnooze time).
    guidance:
      use: "see what's deferred and when each returns"
      telemetry_signal_default: "warm"
    http: GET /mail/snoozed
    params:
      format: { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  listLabels:
    description: >
      List the tenant's LABEL DEFINITIONS (name + colour). These are the palette
      of labels; applying one to a message is updateMessage / bulkUpdateMessages.
    guidance:
      use: "see which labels exist before tagging messages"
      next: "createLabel to add one; updateMessage labels=[...] to apply"
      warn: "this manages label DEFINITIONS — to put a label ON a message use updateMessage or bulkUpdateMessages add_label."
      telemetry_signal_default: "warm"
    http: GET /mail/labels
    params:
      format: { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  createLabel:
    description: Define a new label with a name and a hex colour.
    guidance:
      use: "create a reusable label (e.g. 'hot-lead', '#EF4444')"
      warn: "color is a 6-digit hex like #6B7280 (default). name ≤50 chars."
      telemetry_signal_default: "cold"
    http: POST /mail/labels
    params:
      name:  { type: string, required: true,  description: 'Label name (≤50 chars)' }
      color: { type: string, required: false, description: 'Hex colour #RRGGBB (default #6B7280)' }
    response: { format: json }

  updateLabel:
    description: Rename or recolour a label definition.
    guidance:
      use: "edit a label's name or colour"
      telemetry_signal_default: "cold"
    http: PATCH /mail/labels/{label_id}
    params:
      label_id: { type: string, required: true,  description: 'Label id' }
      name:     { type: string, required: false, description: 'New name (≤50 chars)' }
      color:    { type: string, required: false, description: 'New hex colour #RRGGBB' }
    response: { format: json }

  deleteLabel:
    description: Delete a label definition.
    guidance:
      use: "remove a label from the palette"
      warn: "removes the definition; messages previously tagged keep the raw string until re-saved."
      telemetry_signal_default: "cold"
    http: DELETE /mail/labels/{label_id}
    params:
      label_id: { type: string, required: true, description: 'Label id' }
    response: { format: json }

  listViews:
    description: >
      List saved inbox views — named filter bundles ("Hot leads", "Starred only",
      one mailbox). A view's filter_config can be applied to getInbox via view_id.
    guidance:
      use: "see saved filter bundles you can apply with getInbox(view_id=...)"
      next: "createView to save one; getInbox view_id=<id> to apply"
      telemetry_signal_default: "warm"
    http: GET /mail/views
    params:
      format: { type: string, required: false, description: 'json (default) | yaml | md' }
    response: { format: json }

  createView:
    description: >
      Save a named inbox view from a filter_config (mailboxes, unread_only,
      starred_only, has_attachments). Set is_shared to expose it to the whole team.
    guidance:
      use: "save a reusable filter (e.g. unread starred across two mailboxes)"
      next: "getInbox view_id=<new id> to apply it"
      warn: "is_shared=true exposes the view to every dashboard user of the client; only the creator can edit it."
      telemetry_signal_default: "cold"
    http: POST /mail/views
    params:
      name:           { type: string,  required: true,  description: 'View name (≤200 chars)' }
      filter_config:
        type: object
        required: false
        description: '{ mailboxes[], unread_only, starred_only, has_attachments }'
        properties:
          mailboxes:       { type: array,   items: string, required: false, description: 'Email addresses to include; omit/null for all client mailboxes' }
          unread_only:     { type: boolean, required: false, description: 'Only unread messages (default false)' }
          starred_only:    { type: boolean, required: false, description: 'Only starred messages (default false)' }
          has_attachments: { type: boolean, required: false, description: 'Only messages with attachments (null = no filter)' }
      color:          { type: string,  required: false, description: 'Display colour' }
      sort_by:        { type: string,  required: false, description: 'Sort field (default date)' }
      sort_direction: { type: string,  required: false, description: 'ASC | DESC (default DESC)' }
      is_shared:      { type: boolean, required: false, description: 'Share with the whole client team (default false)' }
    response: { format: json }

  getView:
    description: Get one saved view by id (its filter_config + display config).
    guidance:
      use: "inspect a saved view's filters"
      telemetry_signal_default: "warm"
    http: GET /mail/views/{view_id}
    params:
      view_id: { type: string, required: true, description: 'Saved view id' }
    response: { format: json }

  updateView:
    description: Edit a saved view (creator-only).
    guidance:
      use: "change a saved view's name, filters, or sharing"
      warn: "only the creator can mutate a view, even a shared one."
      telemetry_signal_default: "cold"
    http: PATCH /mail/views/{view_id}
    params:
      view_id:        { type: string,  required: true,  description: 'Saved view id' }
      name:           { type: string,  required: false, description: 'New name' }
      filter_config:
        type: object
        required: false
        description: 'New filter config'
        properties:
          mailboxes:       { type: array,   items: string, required: false, description: 'Email addresses to include; omit/null for all client mailboxes' }
          unread_only:     { type: boolean, required: false, description: 'Only unread messages (default false)' }
          starred_only:    { type: boolean, required: false, description: 'Only starred messages (default false)' }
          has_attachments: { type: boolean, required: false, description: 'Only messages with attachments (null = no filter)' }
      color:          { type: string,  required: false, description: 'New colour' }
      sort_by:        { type: string,  required: false, description: 'Sort field' }
      sort_direction: { type: string,  required: false, description: 'ASC | DESC' }
      is_shared:      { type: boolean, required: false, description: 'Share with the team' }
    response: { format: json }

  deleteView:
    description: Delete a saved view (creator-only).
    guidance:
      use: "remove a saved view"
      telemetry_signal_default: "cold"
    http: DELETE /mail/views/{view_id}
    params:
      view_id: { type: string, required: true, description: 'Saved view id' }
    response: { format: json }

  # ── Outreach + warmup (Smartlead / lemlist / Instantly) ───────
  # Brand-scoped (/brands/{brand_id}/...). Reads are PAT-ok; writes (update/
  # delete/sync) require brand-admin. Connections are CREATED in the dashboard
  # IntegrationsTab — this skill reads/edits/syncs/revokes them. See
  # references/outreach-warmup.md.
  listOutreachConnections:
    description: >
      List the brand's outreach sidecars (one per Smartlead / lemlist / Instantly
      integration) — provider, workspace_id, warmup_tag, lemwarm_domains, active flag.
    guidance:
      use: "see which cold-email/warmup providers are connected to this brand"
      next: "listOutreachSenders for the sending accounts; getOutreachHealthOverview for deliverability"
      warn: "brand-scoped: brand_id is the numeric brand id, not a mailbox. Connections are created in the dashboard IntegrationsTab, not here."
      telemetry_signal_default: "warm"
    http: GET /brands/{brand_id}/mail/outreach/connections
    params:
      brand_id: { type: string, required: true, description: 'Numeric brand id' }
    response: { format: json }

  getOutreachConnection:
    description: Get one outreach connection by id (provider, workspace_id, warmup_tag, lemwarm_domains, active).
    guidance:
      use: "inspect one outreach/warmup sidecar's config"
      telemetry_signal_default: "warm"
    http: GET /brands/{brand_id}/mail/outreach/connections/{connection_id}
    params:
      brand_id:      { type: string, required: true, description: 'Numeric brand id' }
      connection_id: { type: string, required: true, description: 'Outreach connection id' }
    response: { format: json }

  updateOutreachConnection:
    description: >
      Edit an outreach connection — workspace_id, warmup_tag (the tag that marks
      warmup sends), lemwarm_domains, is_active, smartlead_client_id (agency
      sub-account scoping), or max_active_leads (the lead-push cap). BRAND-ADMIN only.
    guidance:
      use: "change warmup_tag/domains, pause (is_active=false), set the SmartLead agency client_id, or set max_active_leads (the per-account lead cap)"
      warn: "requires brand-admin (a plain PAT read-only token gets 403). Does NOT touch the underlying api_integrations credential. Set smartlead_client_id only for OUR shared/agency account; leave empty when the tenant uses their own SmartLead key."
      telemetry_signal_default: "cold"
    http: PATCH /brands/{brand_id}/mail/outreach/connections/{connection_id}
    params:
      brand_id:            { type: string,  required: true,  description: 'Numeric brand id' }
      connection_id:       { type: string,  required: true,  description: 'Outreach connection id' }
      workspace_id:        { type: string,  required: false, description: 'Provider workspace id (≤128 chars)' }
      warmup_tag:          { type: string,  required: false, description: 'Tag marking warmup sends' }
      lemwarm_domains:     { type: array,   items: string, required: false, description: 'lemlist warmup domains' }
      is_active:           { type: boolean, required: false, description: 'Enable / pause the sidecar' }
      smartlead_client_id: { type: string,  required: false, description: 'SmartLead agency/whitelabel client id; empty string clears it (own-account mode)' }
      max_active_leads:    { type: integer, required: false, description: 'Cap on distinct leads pushed via this connection (0+); omit/null = uncapped' }
    response: { format: json }

  deleteOutreachConnection:
    description: >
      Remove an outreach sidecar (and FK-cascade its senders + campaigns + health
      snapshots). Leaves the underlying api_integrations row intact. BRAND-ADMIN only.
    guidance:
      use: "disconnect an outreach provider sidecar"
      warn: "BRAND-ADMIN + destructive: cascades senders/campaigns/health. The user must remove the api_integrations entry separately. No undo."
      telemetry_signal_default: "cold"
    http: DELETE /brands/{brand_id}/mail/outreach/connections/{connection_id}
    params:
      brand_id:      { type: string, required: true, description: 'Numeric brand id' }
      connection_id: { type: string, required: true, description: 'Outreach connection id' }
    response: { format: json }

  syncOutreachConnection:
    description: >
      Pull the latest sender accounts from the provider into mail_outreach_senders
      and match them to local mailboxes. Returns counts (found / inserted / updated
      / mailbox_matches). BRAND-ADMIN only.
    guidance:
      use: "refresh the sending accounts + warmup state from Smartlead/lemlist/Instantly"
      next: "listOutreachSenders to see the synced accounts; getOutreachHealthOverview for their health"
      warn: "BRAND-ADMIN. This calls the provider API — it can take time; the route has a long (900s) proxy timeout."
      telemetry_signal_default: "cold"
    http: POST /brands/{brand_id}/mail/outreach/connections/{connection_id}/sync
    params:
      brand_id:      { type: string, required: true, description: 'Numeric brand id' }
      connection_id: { type: string, required: true, description: 'Outreach connection id' }
    response: { format: json }

  listOutreachSenders:
    description: >
      List every sending account across the brand's outreach connections —
      email_address, provider, warmup_enabled, status, and the matched local mailbox_id.
    guidance:
      use: "see all cold-email sending accounts + whether warmup is on for each"
      next: "getSenderHealth for one sender's deliverability snapshot"
      telemetry_signal_default: "warm"
    http: GET /brands/{brand_id}/mail/outreach/senders
    params:
      brand_id: { type: string, required: true, description: 'Numeric brand id' }
    response: { format: json }

  getSenderHealth:
    description: >
      One sender's latest deliverability/warmup snapshot — health_score, sent/inbox/
      spam/bounce/reply counts (24h + 7d), warmup_enabled, polled_at.
    guidance:
      use: "check a sending account's deliverability + warmup health"
      warn: "the snapshot is the LATEST poll, not live — see polled_at. May be null if never polled."
      telemetry_signal_default: "warm"
    http: GET /brands/{brand_id}/mail/outreach/senders/{sender_id}/health
    params:
      brand_id:  { type: string, required: true, description: 'Numeric brand id' }
      sender_id: { type: string, required: true, description: 'Outreach sender id' }
    response: { format: json }

  getOutreachHealthOverview:
    description: >
      Latest health snapshot per sender for the whole brand — one row per sending
      account. The deliverability/warmup grid for all outreach accounts at once.
    guidance:
      use: "one-shot deliverability/warmup overview across every sending account"
      next: "getSenderHealth for one sender's detail"
      telemetry_signal_default: "warm"
    http: GET /brands/{brand_id}/mail/outreach/health/overview
    params:
      brand_id: { type: string, required: true, description: 'Numeric brand id' }
    response: { format: json }

  # ── Slice D: push a campaign's verified leads → a chosen SmartLead campaign ──

  listOutreachCampaigns:
    description: >
      List the SmartLead campaigns this connection can see (scoped by its agency
      smartlead_client_id) — remote_campaign_id, name, status, lead_count. The
      picker you read BEFORE pushing leads.
    guidance:
      use: "find the target SmartLead campaign id to push leads into"
      next: "pushOutreachLeads with the chosen remote_campaign_id"
      warn: "only SmartLead implements this; lemlist/Instantly return 400. For OUR shared account the list is already client-scoped via the connection's smartlead_client_id."
      telemetry_signal_default: "warm"
    http: GET /brands/{brand_id}/mail/outreach/connections/{connection_id}/campaigns
    params:
      brand_id:      { type: string, required: true, description: 'Numeric brand id' }
      connection_id: { type: string, required: true, description: 'Outreach connection id' }
    response: { format: json }

  pushOutreachLeads:
    description: >
      Push a SpiderIQ campaign's verified leads into a chosen SmartLead campaign.
      Idempotent (already-pushed leads are skipped, never double-added). Returns
      added/skipped counts + the account's active-lead total. BRAND-ADMIN only.
    guidance:
      use: "send a finished campaign's verified leads into a SmartLead campaign for outreach"
      next: "getOutreachPushStatus to confirm counts; removeOutreachLeads to undo"
      warn: "BRAND-ADMIN. 409 account_lead_cap_reached if max_active_leads would be exceeded — pass `limit` to trim to the headroom instead of erroring, or removeOutreachLeads to free credits first. Only verified-email leads are pushed."
      telemetry_signal_default: "cold"
    http: POST /brands/{brand_id}/mail/outreach/connections/{connection_id}/push
    params:
      brand_id:                { type: string,  required: true,  description: 'Numeric brand id' }
      connection_id:           { type: string,  required: true,  description: 'Outreach connection id' }
      spideriq_campaign_id:    { type: string,  required: true,  description: 'Source SpiderIQ campaign id' }
      remote_campaign_id:      { type: string,  required: true,  description: 'Target SmartLead campaign id (from listOutreachCampaigns)' }
      smartlead_campaign_name: { type: string,  required: false, description: 'Target campaign name (for the confirmation notification)' }
      limit:                   { type: integer, required: false, description: 'Add at most N new leads; also trims to the account cap instead of erroring' }
    response: { format: json }

  removeOutreachLeads:
    description: >
      Remove tracked leads from a SmartLead campaign (frees account lead credits).
      Scope by spideriq_campaign_id and/or an explicit email list; with neither,
      removes ALL leads SpiderIQ pushed to that campaign. BRAND-ADMIN only.
    guidance:
      use: "pull leads back out of a SmartLead campaign / free account lead credits"
      next: "getOutreachPushStatus to confirm the freed headroom"
      warn: "BRAND-ADMIN. Only removes leads SpiderIQ itself pushed (tracked by lead id); leads added directly in SmartLead are untouched. No undo."
      telemetry_signal_default: "cold"
    http: POST /brands/{brand_id}/mail/outreach/connections/{connection_id}/remove
    params:
      brand_id:             { type: string, required: true,  description: 'Numeric brand id' }
      connection_id:        { type: string, required: true,  description: 'Outreach connection id' }
      remote_campaign_id:   { type: string, required: true,  description: 'Target SmartLead campaign id' }
      spideriq_campaign_id: { type: string, required: false, description: 'Only remove leads from this source campaign' }
      emails:               { type: array,  items: string, required: false, description: 'Only remove these specific lead emails' }
    response: { format: json }

  getOutreachPushStatus:
    description: >
      Quota usage (active_leads / max_active_leads / available) + per-campaign push
      counts (pushed / skipped / removed) for a connection.
    guidance:
      use: "see how many leads are in each SmartLead campaign and how much account headroom is left"
      next: "pushOutreachLeads (if headroom) or removeOutreachLeads (to free credits)"
      telemetry_signal_default: "warm"
    http: GET /brands/{brand_id}/mail/outreach/connections/{connection_id}/push-status
    params:
      brand_id:      { type: string, required: true, description: 'Numeric brand id' }
      connection_id: { type: string, required: true, description: 'Outreach connection id' }
    response: { format: json }

  # ── Document conversion (card 2.3) ───────────────────────────
  # Same worker as sendEmail — the SpiderMail worker is the only job-consuming
  # image carrying liteparse + LibreOffice + ImageMagick + Ghostscript.
  convertDocument:
    description: >
      Convert a document (PDF / DOCX / XLSX / PPTX / CSV / HTML / image) to
      markdown. Returns a job_id, NOT the markdown — extraction runs OCR and
      office conversion on a worker and can take minutes. Supply exactly one of
      media_id (already uploaded to SpiderMedia) or content_base64 (inline,
      ≤10 MB decoded). The document type is decided by MAGIC BYTES, so filename
      and mime_type are advisory: a mislabelled file still converts correctly,
      and a .pdf that is really something else reports its real type.
    guidance:
      use: "turn a PDF/DOCX/XLSX/PPTX/image into markdown an agent can actually read"
      next: "getConversion with the returned job_id — a 202 means QUEUED, not converted. Read getConversion's warning first: as of 2026-08-06 that read path returns data: null for every convert job (card C.8), so a null there does not mean your conversion failed."
      warn: "ASYNC — there is no synchronous variant and asking for one will not produce a body. full_text defaults FALSE (you get a 1500-char preview); set it true only when you need the whole document, because large extractions move real bytes. ocr='never' is much cheaper on a big scanned corpus but ERRORS on images, which have no text layer."
      telemetry_signal_default: "cold"
    http: POST /jobs/spiderConvert/submit
    params:
      payload:
        type: object
        required: true
        description: The conversion payload
        properties:
          media_id:       { type: string,  required: false, description: 'SpiderMedia media_id of an uploaded document. Use for anything over a few MB.' }
          content_base64: { type: string,  required: false, description: 'Base64 document bytes for small inline submissions (≤10 MB decoded)' }
          filename:       { type: string,  required: false, description: 'Original filename. ADVISORY ONLY — type comes from magic bytes.' }
          mime_type:      { type: string,  required: false, description: 'Declared MIME type. Advisory only, same as filename.' }
          full_text:      { type: boolean, required: false, description: 'Return the complete markdown body instead of the 1500-char preview (default false). ALSO the precondition for object storage — it is checked BEFORE the size threshold, so without it storage_key is null at any size and a 2 MB document still comes back as a preview.' }
          ocr:            { type: string,  required: false, description: 'auto (default) | force | never — OCR policy for scanned documents' }
          test:           { type: boolean, required: false, description: 'Route to the test queue (default false)' }
    response: { format: json }

  getConversion:
    description: >
      Fetch a finished conversion. Returns markdown, preview, pages,
      source_format, size_original, size_markdown and truncated. `source_format`
      is what the magic bytes said, not what was declared. `truncated` true has
      THREE causes and storage_key does not separate them: full_text was false;
      or full_text was true and the markdown exceeded the inline threshold, so
      storage_key holds the remainder; or the EXTRACTOR stopped early, in which
      case the text was never produced and nothing retrieves it. Read
      `truncation_notice` (recoverable — it names the remedy) and
      `extraction_notice` / `extraction_truncated` (permanent) instead.
    guidance:
      use: "read the markdown produced by convertDocument"
      next: "if truncated=true, read truncation_notice — it names the remedy. storage_key set means follow it to /content; storage_key null means re-submit with full_text=true (it is null at ANY size when the flag was unset, so its absence is NOT evidence the document is small or that storage is broken)"
      warn: >
        🔴 KNOWN DEFECT, OPEN AS OF 2026-08-06 (card C.8). This endpoint
        currently returns `data: null` for EVERY spiderConvert job, in all
        three formats (json / yaml / md). It is a type-dispatch omission, not
        a failure of your conversion: `spiderConvert` is missing from the
        results endpoint's passthrough set and has no transform branch, so a
        payload that exists and is correct gets flattened away on the way out.
        A small document fails identically to a large one, so this is not a
        size or truncation effect.

        ⇒ DO NOT read `data: null` here as "the conversion failed" and do not
        retry the conversion — the retry will convert successfully and return
        null again. Check `status` on the job instead: `completed` means the
        markdown was produced and is simply unreachable through this route
        today. A fix is in flight; this warning will be removed when it lands.

        CHECK THE `security` FIELD BEFORE FEEDING THIS TO A MODEL, once the
        payload is reachable. Extracted document text is a prompt-injection
        vector; security.safe=false means the document contains
        instruction-like content. The text is returned unmodified — you decide
        what to do with it.
      telemetry_signal_default: "warm"
    http: GET /jobs/{job_id}/results
    params:
      job_id: { type: string, required: true,  description: 'The job_id returned by convertDocument' }
      format: { type: string, required: false, description: 'json (default) | yaml | md — yaml/md are markedly cheaper to read' }
    response: { format: json }

  # ── Body conversion, markdown ↔ HTML (card 3.2) ───────────────
  # A DIFFERENT operation from convertDocument. This one is SYNCHRONOUS, takes a
  # string rather than a file, and only speaks markdown/html. It exists because
  # the send path and the read path used to disagree about when markdown→HTML
  # should fire; the caller now declares the intent and nothing is ever sniffed.
  convertMailBody:
    description: >
      Convert an email body between markdown and HTML, synchronously, in the
      response. You declare both formats — `from` and `to` must differ and
      neither is inferred from the content. `mode` selects the flavour: `raw`
      reproduces byte-for-byte what the existing send/read paths already
      produce, `fit` (the default) adapts the output for its destination and is
      round-trip stable, `minimal` is the smallest faithful output. The response
      echoes from/to/mode alongside the byte sizes, so a caller never has to
      guess what happened to its input.
    guidance:
      use: "prepare a body for a destination — markdown you wrote into send-ready HTML, or an HTML body into markdown you can read — without a job or a round-trip"
      next: "sendEmail with the converted body, or feed the markdown to a model"
      warn: "SYNCHRONOUS and string-only — this is NOT convertDocument (that one takes a FILE, is async, and returns a job_id). `from` must differ from `to` or you get 422. The 65,536-byte cap counts UTF-8 BYTES, not characters, so multi-byte content hits it at far fewer characters than 65,536 — over-limit returns 413."
      telemetry_signal_default: "warm"
    http: POST /mail/convert
    params:
      from:    { type: string, required: true,  description: 'Format of `content`: markdown | html' }
      to:      { type: string, required: true,  description: 'Format to convert into: markdown | html. MUST differ from `from` (422 otherwise).' }
      content: { type: string, required: true,  description: 'The body to convert. Max 65,536 bytes encoded as UTF-8 (413 over-limit).' }
      mode:    { type: string, required: false, description: 'raw | fit (default) | minimal — see the description; `raw` matches what send/read already emit' }
    response: { format: json }

  # ══════════════════════════════════════════════════════════════
  # SEND TIER — your own sending pool (Broadcasting v3, card 2.SK)
  # ══════════════════════════════════════════════════════════════
  # The layer UNDER sendEmail. sendEmail puts ONE message through ONE registered
  # mailbox; these operate the sending FLEET. Routes live at
  # /api/v1/dashboard/send/* and are tenant-scoped by the caller's own PAT
  # (require_tenant_scoped_access, allow_api_client=True). Reads take `member`,
  # anything that can put mail on the wire takes `admin` — a read-only token gets
  # 403 on enroll / create / update / cancel / queue.
  #
  # The MCP tool name for each of these is the snake_case of the method name
  # (sendCheckDomain -> send_check_domain), so the mapping needs no table.
  #
  # Read references/run-a-broadcast.md before driving the whole flow.

  # ── BYO sending domain: publish DNS, we verify, it joins your pool ──
  sendCheckDomain:
    description: >
      Dry-run the SPF / DKIM / tracking-CNAME checks for a sending domain you
      own. Stores nothing, binds nothing and needs no API key — so you can
      publish records, check, fix and re-check as often as you like.

      Each check is TRI-STATE: `ok=true` read and correct, `ok=false` read and
      wrong/missing, `ok=null` UNDETERMINABLE (the resolver could not be read).
      The top-level `verified` is true only when all three are true. When a check
      fails, its `expected` field names the exact record to publish — the DKIM
      one names `<selector>._domainkey.<domain>` — so hand that to the user
      instead of a generic error.
    guidance:
      use: "before enrolling a sending domain, and any time a tenant asks why their domain will not verify — this is the loop they iterate on"
      next: "sendEnrollDomain once verified=true; sendListSources to confirm it joined the pool"
      warn: "ok=null is UNDETERMINABLE, NEVER a pass — reporting a null verdict as success sends a tenant to enrolment that will refuse. Capped at 20 checks per minute per tenant; the 429 carries Retry-After."
      telemetry_signal_default: "warm"
    http: POST /dashboard/send/byo/check
    params:
      domain:          { type: string, required: true,  description: "The sending domain, e.g. 'mg.example.com' (3-253 chars)" }
      provider:        { type: string, required: false, description: "Sending provider (default: 'mailgun')" }
      dkim_selector:   { type: string, required: false, description: "The DKIM selector from your provider dashboard — a SINGLE label (default: 'mailo')" }
      tracking_domain: { type: string, required: false, description: "Defaults to 'email.<domain>' when omitted" }
    response: { format: json }

  sendEnrollDomain:
    description: >
      Verify a sending domain, store the tenant's OWN provider API key
      encrypted, and bind the sending source to this tenant. Admin-level.
      Nothing is written unless the DNS verifies; the credential is stored
      BEFORE the source is bound.

      This BINDS an already-enrolled source — it never CREATES one. A mailbox
      with no capacity row is refused with 409 `source_not_enrolled` rather than
      provisioned. It also never promotes a cold domain to `active`: the
      returned `state` is reported unchanged, so the warm-up ramp still applies.
      The api_key is never echoed back — only an opaque `vault_key_ref`.
    guidance:
      use: "the one write that turns a verified domain into a sending source this tenant owns"
      next: "sendListSources to read the new source's warm-up state and daily cap"
      warn: "REQUIRES verified DNS and admin role. For an EU Mailgun account you MUST pass api_base='https://api.eu.mailgun.net' — an EU key against the US host 401s and the source is terminalised. enable_tracking=false binds NO tracking domain: link rewriting is OFF (safe — your links are never routed through a host you do not own) at the cost of every click and open event. Capped at 10 enrolments per hour per tenant."
      telemetry_signal_default: "cold"
    http: POST /dashboard/send/byo/enroll
    params:
      mailbox_id:      { type: integer, required: true,  description: 'The already-enrolled sending source to bind. Must already have a capacity row, or 409 source_not_enrolled.' }
      domain:          { type: string,  required: true,  description: 'The sending domain to bind' }
      api_key:         { type: string,  required: true,  description: 'YOUR provider API key (8-512 chars). Stored encrypted; never returned.' }
      provider:        { type: string,  required: false, description: "Sending provider (default: 'mailgun')" }
      dkim_selector:   { type: string,  required: false, description: "DKIM selector (default: 'mailo')" }
      tracking_domain: { type: string,  required: false, description: "Defaults to 'email.<domain>'. Ignored when enable_tracking is false." }
      enable_tracking: { type: boolean, required: false, description: 'Default true. FALSE binds tracking_domain to NULL — link rewriting OFF, never the platform tracking host.' }
      api_base:        { type: string,  required: false, description: "Provider API base. REQUIRED for EU Mailgun ('https://api.eu.mailgun.net')." }
      brand_id:        { type: integer, required: false, description: 'Recorded for admin surfaces. NOT the isolation key — that is always the tenant.' }
    response: { format: json }

  # ── arming a sending identity ──────────────────────────────────
  sendPromoteSource:
    description: >
      Promote a WARMING sending source to `active` — the one call that arms a
      sending identity for real mail.

      Until a source reaches `active` it is never claimed by the send loop, and
      every broadcast queued against the pool refuses with `no_sources`. This
      is the transition that ends that, and there is no other route to it.

      Promotion also RE-STAMPS the ramp: `warmup_started_on` is set to today in
      the source's own timezone, so a graduated source starts at day 1 of its
      warm-up curve rather than resuming at whatever rate a months-old anchor
      would imply. Read `effective_daily_cap` (what it may send TODAY, normally
      8 on the default curve) and never `daily_cap` (the ceiling it reaches at
      the END of the ramp).

      A source that does not exist and a source owned by another tenant return
      the SAME 404 — deliberately indistinguishable, so this route cannot be
      used as an oracle for which mailbox ids exist in someone else's pool.
    guidance:
      use: "arm a warmed-up sending source so broadcasts can actually claim it"
      next: "sendListSources to read the source's new state and its day-1 effective_daily_cap before you size any audience"
      warn: >
        NEVER retry a 409. `promoted: false` is an ANSWER, not a transport
        error: the refusal codes `warmup_not_matured` and
        `reputation_input_required` mean the ramp has not run long enough or the
        source has no reputation samples yet, and calling again changes neither.
        Report the `detail` sentence to the human and stop. The other refusals
        are `source_not_found`, `source_not_warming`, `source_expired`,
        `promote_returned_false` and `send_db_unconfigured`.

        This tenant route CANNOT waive the reputation gate — the request model
        does not carry the field at all. Waiving it is an operator act on a
        separate admin route, by design: an agent proposes, a human approves.

        Requires the `admin` role (a member-role PAT is refused) because this
        arms an identity that sends real mail. `notified: false` alongside
        `promoted: true` is NOT a failed promotion — the source is live and only
        the announcement was lost.
      telemetry_signal_default: "cold"
    http: POST /dashboard/send/sources/{mailbox_id}/promote
    params:
      mailbox_id: { type: integer, required: true, description: 'The warming source to arm. Must already have a capacity row in this tenant''s pool; a foreign or absent id returns 404 identically.' }
    response: { format: json }

  # ── the pool and its reputation ────────────────────────────────
  sendListSources:
    description: >
      List the tenant's sending pool — every mailbox acting as a sending source,
      with warm-up state, daily cap, sent-today, minimum inter-send gap, the BYO
      sending identity and per-source complaint/bounce rates.

      Read this before queueing anything: capacity and warm-up state are what
      decide whether an audience drains in a day or a month. `state` is one of
      warming | active | paused | blocked | auth_failed | retiring | retired.
      A mailbox registered for READING mail is not automatically a sending
      source — only mailboxes with a pacing row appear here.
    guidance:
      use: "answer 'what can this tenant send from, and how fast' — the first read of any broadcast flow"
      next: "sendGetCapacity for the drain math; sendGetDeliverability for the reputation behind these sources"
      warn: "A null complaint_pct / bounce_pct is UNKNOWN, never healthy: with metrics_available=true it means this source dispatched nothing in the window; with it false the aggregation could not run at all. Never render either as 0%. A NULL tracking_domain means link tracking is OFF for that source — it does NOT inherit the platform host. Re-entry (resuming a reputation pause, clearing auth_failed, un-retiring) is operator-gated and has no API here by design — do not offer it."
      telemetry_signal_default: "hot"
    http: GET /dashboard/send/deliverability/sources
    params:
      range:  { type: string, required: false, description: '24h | 7d (default) | 30d | 90d — windows the reputation rates only; pacing state and caps are always current' }
      format: { type: string, required: false, description: 'json (default) | llm — `llm` splices a `guidance` block into the response (what to read, what to call next, the pitfalls). NOT yaml/md: those are per-endpoint on the /mail/* routes and are not implemented on the send tier.' }
    response: { format: json }

  sendGetDeliverability:
    description: >
      Reputation summary for the sending pool over `range`: funnel totals
      (dispatched -> delivered -> opened -> clicked plus
      bounced/complained/unsubscribed/failed), each rate as a percentage of
      DISPATCHED, the provider thresholds those rates are judged against, and
      which feedback links are actually live (`ingest`).
    guidance:
      use: "answer 'is our sending reputation healthy' and check a domain before scaling volume on it"
      next: "sendGetDeliverabilityTimeseries for the trend; sendListUndeliverable for the individual failures"
      warn: "Do NOT score engagement on `opened` — Apple Mail Privacy Protection and proxy preloading fire open pixels with no human involved; use clicked / unique_clickers (opens_are_estimates is always true). A null rate means a ZERO denominator, not a zero rate. `totals.accepted` is a raw provider-event count, normally 0 — it is an INPUT to dispatched, never a denominator. has_events=false with ingest.provider_webhook='dormant' means the feedback door is shut, NOT that delivery is clean."
      telemetry_signal_default: "hot"
    http: GET /dashboard/send/deliverability/summary
    params:
      range:     { type: string, required: false, description: '24h | 7d (default) | 30d | 90d' }
      source_id: { type: string, required: false, description: 'Restrict to a single sending source (36-char id). Omit for the whole pool.' }
      format: { type: string, required: false, description: 'json (default) | llm — `llm` splices a `guidance` block into the response (what to read, what to call next, the pitfalls). NOT yaml/md: those are per-endpoint on the /mail/* routes and are not implemented on the send tier.' }
    response: { format: json }

  sendGetDeliverabilityTimeseries:
    description: >
      Daily bounce and complaint rates across `range`, with the threshold lines
      (complaint limit 0.30%, bounce safe 2%, bounce critical 5%) to compare
      against. The trend, where sendGetDeliverability gives the totals — use it
      to tell a one-off bad batch apart from a degrading domain.
    guidance:
      use: "distinguish a single bad batch from a domain whose reputation is trending down"
      next: "sendListUndeliverable to see what actually bounced on a bad day"
      warn: "The series is SPARSE, not gap-filled — only days with events or dispatches appear, and a day with no volume comes back with null rates. Do not plot a null as 0."
      telemetry_signal_default: "warm"
    http: GET /dashboard/send/deliverability/timeseries
    params:
      range:     { type: string, required: false, description: '24h | 7d (default) | 30d | 90d' }
      source_id: { type: string, required: false, description: 'Restrict to a single sending source (36-char id)' }
      format: { type: string, required: false, description: 'json (default) | llm — `llm` splices a `guidance` block into the response (what to read, what to call next, the pitfalls). NOT yaml/md: those are per-endpoint on the /mail/* routes and are not implemented on the send tier.' }
    response: { format: json }

  sendListUndeliverable:
    description: >
      The individual bounces, complaints and failures behind the rates — newest
      first, keyset-paginated. Filter with `kind`; page by passing the returned
      `next_cursor` back as `cursor`.
    guidance:
      use: "see WHICH addresses failed and why, after a rate looks wrong"
      next: "sendGetDeliverability for the aggregate the failures roll up into"
      warn: "This does NOT suppress anything — `suppress_recipient` is a flag the suppression builder consumes, and writing suppression is a different surface. `next_cursor` is opaque and relative to the ACTIVE FILTER SET: changing kind or range invalidates it. severity='permanent' is the hard bounce; 'temporary' is retryable."
      telemetry_signal_default: "warm"
    http: GET /dashboard/send/deliverability/undeliverable
    params:
      range:     { type: string,  required: false, description: '24h | 7d (default) | 30d | 90d' }
      kind:      { type: string,  required: false, description: 'all (default) | bounce | complaint | failed' }
      limit:     { type: integer, required: false, description: 'Rows per page, 1-200 (default 25)' }
      cursor:    { type: string,  required: false, description: 'Opaque keyset cursor from the previous page' }
      source_id: { type: string,  required: false, description: 'Restrict to a single sending source (36-char id)' }
      format: { type: string, required: false, description: 'json (default) | llm — `llm` splices a `guidance` block into the response (what to read, what to call next, the pitfalls). NOT yaml/md: those are per-endpoint on the /mail/* routes and are not implemented on the send tier.' }
    response: { format: json }

  # ── broadcasts: draft -> preview -> size -> queue ──────────────
  sendPreviewAudience:
    description: >
      Resolve an audience query to a deliverable count WITHOUT persisting
      anything. Always reports the SUBTRACTIONS (`suppressed`, `duplicates`,
      `invalid`) alongside the final `deliverable` number — a shrinking audience
      is normally the deliverability guard working, not missing data.

      `missing_values` reports, per merge tag, how many deliverable recipients
      have no value for it: a tag used in the body with a non-zero count here
      renders as an empty gap ("Hi ,") for that many people.
    guidance:
      use: "size an audience before you compose, and see exactly what the guards removed"
      next: "sendPreviewBroadcast to check the render; sendGetCapacity to see how long it drains"
      warn: "suppression_checked=false means the count is PROVISIONAL — the queue path refuses outright in that state rather than mailing an unchecked list. email_status='any' is the most common cause of a bounce-rate breach: it mails addresses SpiderVerify never confirmed."
      telemetry_signal_default: "warm"
    http: POST /dashboard/send/broadcasts/audience/preview
    params:
      mode:               { type: string,  required: false, description: "crm (default) | subscribers | paste" }
      board_id:           { type: string,  required: false, description: "mode='crm': restrict to one CRM board. Omit for every contact the tenant owns." }
      email_status:       { type: string,  required: false, description: "mode='crm': 'valid' (default) keeps only SpiderVerify-confirmed addresses; 'any' mails unverified ones", values: ["valid", "any"] }
      require_first_name: { type: boolean, required: false, description: "mode='crm': drop contacts with no first_name so {{first_name}} never renders empty" }
      topics:
        type: array
        required: false
        items: { type: string }
        description: "mode='subscribers': restrict to these topics. Empty/omitted = all topics."
      addresses:
        type: array
        required: false
        items: { type: string }
        description: "mode='paste': explicit address list, max 5000."
    response: { format: json }

  sendPreviewBroadcast:
    description: >
      Render a subject + markdown body exactly as a recipient will receive it —
      subject, HTML part and plain-text part. Server-side on purpose: it runs the
      SAME renderer as fan-out, so the preview cannot drift from what actually
      goes out. Pass a `sample` contact to see the {{first_name}}-style merge
      fields filled in; omit it and tags render as themselves.
    guidance:
      use: "check the rendered message before it is queued — subject, HTML and text parts together"
      next: "sendCreateBroadcast (or sendUpdateBroadcast) once the render is right"
      warn: "Persists NOTHING — this renders a string, it does not save a draft. Rendering the markdown yourself in a different library is the one way to make the preview lie."
      telemetry_signal_default: "warm"
    http: POST /dashboard/send/broadcasts/preview
    params:
      subject_template: { type: string, required: false, description: 'Subject line, may contain merge fields e.g. {{first_name}}' }
      body_md:          { type: string, required: false, description: 'Body in markdown (max 500,000 chars)' }
      sample:
        type: object
        required: false
        description: 'A sample recipient to render the merge fields against.'
        properties:
          email:           { type: string, required: true, description: 'Sample recipient address' }
          first_name:      { type: string, description: 'Value for {{first_name}}' }
          full_name:       { type: string, description: 'Value for {{full_name}}' }
          current_company: { type: string, description: 'Value for {{current_company}}' }
    response: { format: json }

  sendGetCapacity:
    description: >
      What this tenant can actually send: the combined warm-up-aware daily cap,
      capacity remaining today, the earliest the pacing engine could release the
      first message, and — when you pass `audience_size` — how many days the
      audience takes to drain at that rate.
    guidance:
      use: "call this before queueing anything large; it is what turns '40,000 recipients' into 'that is 12 days'"
      next: "sendQueueBroadcast once the drain estimate is acceptable"
      warn: "provider_configured=false means nothing can leave yet REGARDLESS of capacity — the rows would queue and hold. drain_days is null when capacity is 0, which is not the same as 'instant'."
      telemetry_signal_default: "warm"
    http: GET /dashboard/send/broadcasts/capacity
    params:
      mailbox_ids:   { type: string,  required: false, description: 'Comma-separated mailbox ids. Omitted = every source the tenant owns.' }
      audience_size: { type: integer, required: false, description: 'Audience size to compute a drain estimate for (default 0, max 10,000,000)' }
    response: { format: json }

  sendListBroadcasts:
    description: >
      List the tenant's broadcasts newest-first with status (draft | queueing |
      queued | cancelled) and live delivery progress. Use it to find the
      broadcast id the get / update / cancel / queue methods take.
    guidance:
      use: "find a broadcast id, or check where an in-flight fan-out has got to"
      next: "sendGetBroadcast for one in full, including per-state progress counters"
      warn: "`status` is the AUTHORING lifecycle, not delivery — a broadcast sits at 'queued' for the whole fan-out. Delivery lives in `progress` (queued/sending/sent/failed/skipped)."
      telemetry_signal_default: "hot"
    http: GET /dashboard/send/broadcasts
    params:
      limit:  { type: integer, required: false, description: 'Rows to return, 1-200 (default 50)' }
      offset: { type: integer, required: false, description: 'Rows to skip (default 0)' }
    response: { format: json }

  sendCreateBroadcast:
    description: >
      Create a broadcast DRAFT. THIS DOES NOT SEND ANYTHING — and setting
      `scheduled_at` does not send it either; that field records intent on the
      draft. Mail leaves only when you call sendQueueBroadcast.

      The draft stores the audience as a QUERY, not a resolved address list, so
      it re-resolves against current data when you queue it — an audience that
      grew between composing and sending is not silently under-sent.
    guidance:
      use: "save a composed broadcast so it can be reviewed, sized and later fanned out"
      next: "sendPreviewAudience -> sendPreviewBroadcast -> sendGetCapacity -> sendQueueBroadcast"
      warn: "Creating a draft is NOT sending, and neither is scheduling one. Requires the admin role. Returns 201 with the draft; nothing is enqueued."
      telemetry_signal_default: "cold"
    http: POST /dashboard/send/broadcasts
    params:
      name:             { type: string, required: false, description: "Internal label (default 'Untitled broadcast')" }
      subject_template: { type: string, required: false, description: 'Subject, may contain merge fields' }
      preheader:        { type: string, required: false, description: 'Inbox preview text shown after the subject' }
      body_md:          { type: string, required: false, description: 'Body in markdown (max 500,000 chars)' }
      from_name:        { type: string, required: false, description: 'Display name on the From header' }
      reply_to:         { type: string, required: false, description: 'Reply-To address' }
      audience:
        type: object
        required: false
        description: 'WHO to send to, expressed as a QUERY. Re-resolved at fan-out.'
        properties:
          mode:               { type: string,  description: "crm (default) | subscribers | paste", values: ["crm", "subscribers", "paste"] }
          board_id:           { type: string,  description: "mode='crm': restrict to one CRM board" }
          email_status:       { type: string,  description: "mode='crm': 'valid' (default) | 'any'", values: ["valid", "any"] }
          require_first_name: { type: boolean, description: "mode='crm': drop contacts with no first_name" }
          topics:             { type: array,   items: { type: string }, description: "mode='subscribers': restrict to these topics" }
          addresses:          { type: array,   items: { type: string }, description: "mode='paste': explicit address list, max 5000" }
      source_mailbox_ids:
        type: array
        required: false
        items: { type: integer }
        description: 'Sending sources that may carry it (max 64). Omitted/empty = every active source.'
      scheduled_at:     { type: string, required: false, description: 'ISO 8601 timestamp recording WHEN you intend to send. Records intent only — it does NOT queue the broadcast.' }
    response: { format: json }

  sendGetBroadcast:
    description: >
      Get one broadcast in full, including live delivery progress (queued /
      sending / sent / failed / skipped / total) aggregated from the send queue
      at read time. This is how you follow a fan-out after sendQueueBroadcast
      returns.
    guidance:
      use: "watch a fan-out drain, or read back exactly what a draft is going to send"
      next: "sendGetDeliverability once volume has landed, to see how it was received"
      warn: "Progress is aggregated at READ time and never cached on the broadcast — poll it rather than trusting an earlier copy. 404 is a genuine not-found for this tenant; there is no cross-tenant read."
      telemetry_signal_default: "hot"
    http: GET /dashboard/send/broadcasts/{broadcast_id}
    params:
      broadcast_id: { type: string, required: true,  description: 'The broadcast id (36-char)' }
    response: { format: json }

  sendUpdateBroadcast:
    description: >
      Update a DRAFT broadcast. True PATCH — only the fields you pass are
      written. Drafts only: a queued broadcast returns 409 `not_draft`, because
      editing it would change what the composer shows without changing a single
      already-queued message.
    guidance:
      use: "fix a draft's copy, audience, sources or intended time before it is queued"
      next: "sendPreviewBroadcast to re-check the render, then sendQueueBroadcast"
      warn: "409 not_draft means the broadcast is already queued or cancelled and this edit would be cosmetic — it can no longer change what recipients receive. Requires the admin role."
      telemetry_signal_default: "cold"
    http: PATCH /dashboard/send/broadcasts/{broadcast_id}
    params:
      broadcast_id:     { type: string, required: true,  description: 'The draft to update' }
      name:             { type: string, required: false, description: 'Internal label' }
      subject_template: { type: string, required: false, description: 'Subject, may contain merge fields' }
      preheader:        { type: string, required: false, description: 'Inbox preview text' }
      body_md:          { type: string, required: false, description: 'Body in markdown' }
      from_name:        { type: string, required: false, description: 'Display name on the From header' }
      reply_to:         { type: string, required: false, description: 'Reply-To address' }
      audience:
        type: object
        required: false
        description: 'Replacement audience QUERY (same shape as sendCreateBroadcast).'
        properties:
          mode:               { type: string,  description: "crm (default) | subscribers | paste", values: ["crm", "subscribers", "paste"] }
          board_id:           { type: string,  description: "mode='crm': restrict to one CRM board" }
          email_status:       { type: string,  description: "mode='crm': 'valid' (default) | 'any'", values: ["valid", "any"] }
          require_first_name: { type: boolean, description: "mode='crm': drop contacts with no first_name" }
          topics:             { type: array,   items: { type: string }, description: "mode='subscribers': restrict to these topics" }
          addresses:          { type: array,   items: { type: string }, description: "mode='paste': explicit address list, max 5000" }
      source_mailbox_ids:
        type: array
        required: false
        items: { type: integer }
        description: 'Replacement source list (max 64).'
      scheduled_at:     { type: string, required: false, description: 'ISO 8601, or null to clear the intended send time' }
    response: { format: json }

  sendCancelBroadcast:
    description: >
      Cancel a broadcast that has not been fanned out. Rows ALREADY queued are
      deliberately NOT withdrawn — pulling messages out from under the send loop
      is a different, riskier operation than abandoning a draft. So this stops a
      broadcast from starting; it does not reliably stop one already in flight.
      Answers 204 with no body.
    guidance:
      use: "abandon a draft, or stop a broadcast that has not started fanning out"
      next: "sendListBroadcasts to confirm the status flipped to 'cancelled'"
      warn: "THIS IS NOT AN UNDO for a queued broadcast. Anything already enqueued still sends. If mail is already on the wire, say so plainly rather than implying it was recalled. Requires the admin role."
      telemetry_signal_default: "cold"
    http: DELETE /dashboard/send/broadcasts/{broadcast_id}
    params:
      broadcast_id: { type: string, required: true, description: 'The broadcast to cancel' }
    response: { format: json }

  sendQueueBroadcast:
    description: >
      THE IRREVERSIBLE STEP — fans the draft out into the send queue, and real
      mail goes to real people. Confirm with the user before calling it. Returns
      202: the rows are enqueued and the pacing engine releases them at the
      pool's warm-up-aware rate.

      TWO RESULTS THAT LOOK LIKE FAILURES AND ARE NOT. `already_enqueued > 0` is
      a RESUMED fan-out — the enqueue is idempotent per (broadcast, address), so
      a retry after an interruption fills only the gaps instead of
      double-sending. `provider_configured: false` means the rows are queued and
      will HOLD until credentials exist: a deliberate dormant state, reported
      honestly rather than faked as sent.

      The real refusals: 422 `no_audience` (zero deliverable recipients), 422
      `no_sources` (no active sending source), and 503 when the suppression list
      cannot be read — it fails CLOSED rather than mailing an unchecked list.
    guidance:
      use: "the single call that puts a broadcast on the wire, after the audience, render and capacity have all been checked"
      next: "sendGetBroadcast to watch progress; sendGetDeliverability once volume lands"
      warn: "IRREVERSIBLE for every row it enqueues — sendCancelBroadcast does NOT withdraw them. Get explicit user confirmation of the audience size and the sending sources first. Requires the admin role. Do not retry on a 503: it means suppression could not be read, and a retry that succeeds mails a list nobody checked."
      telemetry_signal_default: "cold"
    http: POST /dashboard/send/broadcasts/{broadcast_id}/queue
    params:
      broadcast_id: { type: string, required: true, description: 'The draft to fan out' }
    response: { format: json }
